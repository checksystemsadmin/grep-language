[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grep-language"
version = "0.1.0"
description = "GREP — Global Retrieval, Execution & Processing"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "Nolan G. Sands"}]

[project.scripts]
greplang = "grep_lang.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
